<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Sprint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero-card">
        <div class="hero-copy">
          <p class="eyebrow">Progress over perfection</p>
          <h1>Beat procrastination with one focused study sprint.</h1>
          <p class="hero-text">
            Upload your lecture materials, set a deadline, and receive a short plan that helps you start today.
          </p>
          <div class="hero-badges">
            <span>Works with PowerPoint slides</span>
            <span>Upload several files at once</span>
            <span>Small wins first</span>
          </div>
        </div>

        <div class="wizard-card">
          <form action="/plan" method="post" enctype="multipart/form-data">
            <label class="field">
              <span>Prompt</span>
              <textarea name="prompt" rows="4">Help me make steady progress with limited time. Make the plan realistic, short, and motivating.</textarea>
            </label>

            <label class="field">
              <span>Upload study materials</span>
              <input type="file" name="uploaded_files" accept=".pptx,.docx,.txt" multiple />
              <small class="subtle-note">You can upload more than one file for the demo.</small>
            </label>

            <div class="row-fields">
              <label class="field">
                <span>Deadline</span>
                <input type="text" name="deadline" placeholder="e.g. 3 days from now" />
              </label>
              <label class="field">
                <span>Study time per day</span>
                <input type="number" name="study_minutes_per_day" min="10" max="180" value="45" />
                <small class="subtle-note">This is the number of minutes you can study each day.</small>
              </label>
            </div>

            <button type="submit">Create my study sprint</button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
